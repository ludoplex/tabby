# Tabby Workflow Dependency Update Across Multiple Packages

## Action

Follow the dependency-update-across-multiple-packages workflow:
1. Identify outdated dependencies in multiple package.json files.
2. Update the version numbers in each relevant package.json.
3. Regenerate or update corresponding yarn.lock files for each affected directory.
4. Commit all changed package.json and yarn.lock files together.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: */package.json, */yarn.lock, package.json

